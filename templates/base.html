<!DOCTYPE html>
<!-- FURORE 2026 - Dayananda Sagar College of Engineering Cultural Fest -->
<!-- Website developed by Arya Sharan (aryasharan@example.com) -->
<!-- Backend development, frontend design, and deployment integration -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Furore 2026 | DSCE{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="noise-overlay"></div>
    <header class="site-header">
        <a class="logo" href="{{ url_for('home') }}">FURORE <span>2026</span></a>
        <nav class="main-nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('events') }}">Events</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('guidelines') }}">Guidelines</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Dayananda Sagar College of Engineering | FURORE 2026</p>
        <div class="footer-links">
            <a href="https://www.dsce.edu.in/" target="_blank" rel="noopener noreferrer">DSCE Website</a>
            <a href="https://www.instagram.com/furore.dsce/" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://www.instagram.com/cultdsi/" target="_blank" rel="noopener noreferrer">@cultdsi</a>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
